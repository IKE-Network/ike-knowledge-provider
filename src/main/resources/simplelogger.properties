# Seam-runtime logging (IKE-Network/ike-issues#951): the forked seam forwards child
# stdout/stderr as [seam] lines; warn keeps the channel to accounting and defects
# (orphan skips, dangling references), not store chatter.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.out
